<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background / Shadow Filters -->
    <filter id="pop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="6" dy="6" stdDeviation="0" flood-color="#333333" flood-opacity="1" />
    </filter>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Gradients -->
    <linearGradient id="planetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#007fff" />
      <stop offset="100%" stop-color="#024d9e" />
    </linearGradient>

    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe600" />
      <stop offset="50%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#ef3b2c" />
    </linearGradient>

    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b5b" />
      <stop offset="100%" stop-color="#ef3b2c" />
    </linearGradient>
  </defs>

  <!-- BACKGROUND ORBIT BACK-ARC (Behind the planet) -->
  <path d="M 120 280 C 100 230 140 160 250 140 C 370 120 440 180 430 250" 
        fill="none" 
        stroke="url(#ringGrad)" 
        stroke-width="26" 
        stroke-linecap="round" 
        opacity="0.95" />

  <!-- CELESTIAL PLANET SPHERE -->
  <circle cx="250" cy="250" r="125" 
          fill="url(#planetGrad)" 
          stroke="#333333" 
          stroke-width="9" 
          filter="url(#pop-shadow)" />

  <!-- PLANETARY CONTINENT SHAPES (Minimal Pop-Art) -->
  <!-- Top Island -->
  <path d="M 230 150 C 270 155 310 180 290 205 C 270 230 220 210 210 180 Z" 
        fill="#ffe600" 
        stroke="#333333" 
        stroke-width="6" />

  <!-- Bottom Island -->
  <path d="M 180 280 C 230 270 260 310 240 340 C 210 365 170 330 180 280 Z" 
        fill="#ef3b2c" 
        stroke="#333333" 
        stroke-width="6" />

  <!-- Polar Ice Spark -->
  <ellipse cx="285" cy="155" rx="22" ry="12" fill="#ffffff" />

  <!-- DYNAMIC FOREGROUND ORBITAL LOOP (Forms the 'W' / Curiosity Orbit in front) -->
  <path d="M 80 290 C 70 360 170 410 270 375 C 330 355 370 310 395 240 C 405 210 375 195 350 215 C 310 250 285 330 250 330 C 220 330 200 260 175 260 C 150 260 135 295 110 300" 
        fill="none" 
        stroke="url(#ringGrad)" 
        stroke-width="28" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#pop-shadow)" />

  <path d="M 80 290 C 70 360 170 410 270 375 C 330 355 370 310 395 240 C 405 210 375 195 350 215 C 310 250 285 330 250 330 C 220 330 200 260 175 260 C 150 260 135 295 110 300" 
        fill="none" 
        stroke="#333333" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- SATELLITE MINI-MOON (Orbiting Curiosity Orb) -->
  <circle cx="395" cy="225" r="22" 
          fill="#ffffff" 
          stroke="#333333" 
          stroke-width="6" 
          filter="url(#pop-shadow)" />
  <circle cx="400" cy="220" r="6" fill="#ef3b2c" />

  <!-- TWINKLING STARDUST SPARKLES -->
  <!-- Top Right Sparkle -->
  <path d="M 390 100 L 398 120 L 418 128 L 398 136 L 390 156 L 382 136 L 362 128 L 382 120 Z" 
        fill="#ffe600" 
        stroke="#333333" 
        stroke-width="5" 
        stroke-linejoin="round" />

  <!-- Left Bottom Sparkle -->
  <path d="M 110 180 L 115 195 L 130 200 L 115 205 L 110 220 L 105 205 L 90 200 L 105 195 Z" 
        fill="#ffffff" 
        stroke="#333333" 
        stroke-width="4" 
        stroke-linejoin="round" />
</svg>
